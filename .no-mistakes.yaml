# no-mistakes' own dogfood config.
# Local Test is intentionally empty: the Test step is targeted validation of the
# requested intent (agent-driven smallest relevant checks + evidence), never a
# repository-wide regression suite. Broad race-enabled Go coverage stays in
# remote CI (`go test -race ./...` in .github/workflows/ci.yml) and remains
# mandatory before a PR is ready. See docs/src/content/docs/reference/repo-config.md
# (commands.test) and docs/src/content/docs/reference/pipeline-steps.md (Test).
# Lint and format stay explicit so those gates stay deterministic.

commands:
  lint: "make lint"
  format: "gofmt -w ."

# Pin review auto-fix to the product default so this repo does not inherit an
# operator's global override. Review findings park for a human decision; other
# steps keep their configured behavior.
# Metrics auto-fix stays pinned off while thresholds are calibrated. This repo
# configures no commands.metrics, so the step skips anyway; the pin keeps a
# metrics breach parking for a human if that changes.
auto_fix:
  review: 0
  metrics: 0

# This clone is a personal build that never contributes upstream: the pipeline
# validates and pushes to the fork, and there is no PR to open or CI to watch.
skip_steps:
  - pr
  - ci

# personal-build, not main, is where this clone's work integrates. Rebase reads
# this too, so leaving it unset made every feature branch here replay onto
# origin/main and fail: the branches fork from personal-build, which carries
# commits main does not have. The pr step stays skipped above, so this selects
# the rebase and merge-conflict base rather than opening anything.
pr:
  base_branch: personal-build

# Documentation ownership map for the document step's placement policy.
document:
  instructions: |
    Configuration keys are owned by docs/src/content/docs/reference/global-config.md
    (global fields) and docs/src/content/docs/reference/repo-config.md (repo fields).
    Environment variables and the telemetry local/remote split are owned by
    docs/src/content/docs/reference/environment.md.
    The daemon lifecycle model (singleton lock, lifecycle guard, crash recovery)
    is owned by docs/src/content/docs/concepts/daemon.md.
    Agent-driving guidance is owned by the skill body in internal/skill/skill.go
    and the live axi output strings; docs/src/content/docs/guides/agents.md keeps
    only the canonical invariant sentences pinned by internal/cli/axi_guidance_test.go.
    Guides and troubleshooting pages explain purpose and symptoms and link to the
    owners above instead of restating their tables, examples, or key semantics.
    AGENTS.md holds invariants plus pointers to the authoritative implementation
    and regression tests, and the maintainer writes it by hand, as he does
    CLAUDE.md and every file under docs/adr/. Leave those files exactly as they
    stand and place what you write in the owners above. When a change belongs in
    one of them, report it as a finding naming the file and the exact text you
    would add, and let it reach him.

# Test runbook. With commands.test unset, the Test step's discovery pass infers
# each unit command, and without this it improvised a runner every run (often
# one that no longer builds). The runner is pinned as go.mod tool directives.
test:
  instructions: |
    Run Go tests through the toolchain pinned in go.mod: `go tool gotestsum`
    for the JUnit report and `go tool gocover-cobertura` to convert coverage.
    Never `go run` a versioned runner, and never install one.
    Scope the command to the packages holding the changed .go files, read from
    NO_MISTAKES_CHANGED_FILES, skipping directories the change deleted. Do not
    pass -coverpkg. Keep the test exit code as the command's exit code. Use
    this shape:

      pkgs=$(printf '%s\n' "$NO_MISTAKES_CHANGED_FILES" | grep '\.go$' | xargs -n1 dirname | sort -u | while read -r d; do [ -d "$d" ] && echo "./$d"; done)
      go tool gotestsum --junitfile "$NO_MISTAKES_COVERAGE_DIR/junit.xml" -- -coverprofile="$NO_MISTAKES_COVERAGE_DIR/cover.out" $pkgs; rc=$?
      go tool gocover-cobertura < "$NO_MISTAKES_COVERAGE_DIR/cover.out" > "$NO_MISTAKES_COVERAGE_DIR/coverage.xml"
      exit $rc
